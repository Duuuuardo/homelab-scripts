version: "3.9"

networks:
  proxy:
    driver: bridge

  internal:
    driver: bridge
    internal: true

services:

  # ==========================================
  # REVERSE PROXY
  # ==========================================

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    networks:
      - proxy
      - internal
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./config/npm/data:/data
      - ./config/npm/letsencrypt:/etc/letsencrypt

  # ==========================================
  # DASHBOARD
  # ==========================================

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy
      - internal
    expose:
      - "3000"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ==========================================
  # MEDIA SERVER (FILMES / SERIES / MUSICA)
  # ==========================================

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - proxy
      - internal
    expose:
      - "8096"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/jellyfin:/config
      - ./data:/data
    devices:
      - /dev/dri:/dev/dri

  # ==========================================
  # REQUEST SYSTEM
  # ==========================================

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    networks:
      - proxy
      - internal
    expose:
      - "5055"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/jellyseerr:/app/config

  # ==========================================
  # DOWNLOAD CLIENT
  # ==========================================

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ./data:/data

  # ==========================================
  # INDEXERS
  # ==========================================

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8191"
    environment:
      - TZ=America/Sao_Paulo

  # ==========================================
  # AUTOMATION
  # ==========================================

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/sonarr:/config
      - ./data:/data

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/radarr:/config
      - ./data:/data

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8686"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/lidarr:/config
      - ./data:/data

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "6767"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/bazarr:/config
      - ./data:/data

  # ==========================================
  # ANALYTICS
  # ==========================================

  jellystat-db:
    image: postgres:15
    container_name: jellystat-db
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./config/jellystat-db:/var/lib/postgresql/data

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    depends_on:
      - jellystat-db
    networks:
      - internal
    expose:
      - "3000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: troque-essa-chave
      TZ: America/Sao_Paulo
    volumes:
      - ./config/jellystat:/app/backend/backup-data

  # ==========================================
  # AUTO UPDATE
  # ==========================================

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
